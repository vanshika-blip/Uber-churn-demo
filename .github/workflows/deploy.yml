name: Deploy

# Runs on every push to main (and can be run by hand from the Actions tab).
# 1) Deploys the API (src/index.js) to Cloudflare Workers — it holds the secret keys.
# 2) Publishes the website (public/) to GitHub Pages, pointed at that API.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Cloudflare Workers
        id: worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            HUNAR_API_KEY
            GOOGLE_SERVICE_ACCOUNT_JSON
        env:
          HUNAR_API_KEY: ${{ secrets.HUNAR_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Point the website at the API
        run: |
          API_URL="${{ vars.API_BASE_URL || steps.worker.outputs.deployment-url }}"
          API_URL="${API_URL%/}"
          if [ -z "$API_URL" ]; then
            echo "::error::Could not find the Worker URL. Add a repository variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables) with your workers.dev URL."
            exit 1
          fi
          echo "API URL: $API_URL"
          sed -i "s#__API_BASE__#${API_URL}#g" public/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
